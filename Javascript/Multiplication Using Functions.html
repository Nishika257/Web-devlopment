<!DOCTYPE html>
<html>
    <head>
        <title>Multiplication Using Functions</title>

        <body>
            <h2>Welcome to the world of Javascript</h2>
            <script>
                function Multiply(number1, number2) {
                    let x,y,z;
                    x = number1;
                    y = number2;
                    z = x * y;

                    return z
                }

                let number1 = prompt("Enter the first number:");

                let number2 = prompt("Enter the second number:");

                document.write(Multiply(number1, number2))
            </script>
        </body>
    </head>
</html>
