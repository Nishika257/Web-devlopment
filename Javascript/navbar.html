<!DOCTYPE html>
<html>
    <head>
    <title>Navbar</title>
    <style>
        body {
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        .topnav {
        overflow: hidden;
        background-color: beige;
        }

        .topnav a {
            float: left;
            color:rgb(255, 155, 6) ;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 17px;
        }

        .topnav a:hover {
            background-color: rgb(178, 217, 252);
            color: cornsilk;
        }

        .topnav a.active {
            background-color: rgb(0, 0, 0);
            color: aquamarine;
        }
    </style>
    </head>
    <body>
        <div class="topnav">
            <a class="active" href="#home">Home</a>
            <a href="#">About_Us</a>
            <a href="#">Gallery</a>
            <a href="#">Contact_Us</a>
        </div>
    </body>
</html>
