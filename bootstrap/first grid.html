<!DOCTYPE html>
<html>
    <head>
        <title>My hobby cards</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- STEP 1 - Bootstrap CSS link -->
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

        <style>
            body {
                background-color: rgb(0, 86, 156);
                font-family: monospace;
                padding: 30px 15px;
            }

            h1 {
                text-align: center;
                color: rgb(3, 161, 235);
            }

            .hobby-card {
                text-align: center;
                border: 2px dotted rgb(2, 49, 77);
                border-radius: 8px;
                padding: 20px;
                margin-bottom: 20px;
                background-color:rgb(104, 194, 236);
            }
            .hobby-card h3 {
                color: rgb(0, 0, 0);
            }
        </style>
    </head>
    <body>

        <h1>My hobby cards</h1>

        <!--STEP 2 - container keeps the layout neat and centred-->
        <div class="container">

            <!--STEP 3 - row holds all the columns in one horizontal line -->
            <div class="row">

            <!--STEP 4 - col-12: full width on phones
                         col-md-6: half width on tablets
                         col-lg-4:one-third on desktops -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="hobby-card">
                    <h3>Drawing</h3>
                    <p>I love sketching animals and comic characters.</p>
                    </div>
                    </div>

                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="hobby-card">
                            <h3>playing</h3>
                            <p>I love playing with my friends and family.</p>
                        </div>
                    </div>

                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="hobby-card">
                            <h3>sleeping</h3>
                            <p>I love resting on my bed</p>
                        </div>
                    </div>

                    </div>
                    </div>

                    <!-- STEP 5 - Bootstrap JS script -->
                    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"> </script>
            
    </body>
</html>
