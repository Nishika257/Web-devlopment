<!DOCTYPE html>
<html>
<head>
    <title>My hobby cards</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- STEP 1 - Bootstrap CSS link -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background-color: thistle;
            font-family: monospace;
            padding: 30px 15px;
        }

        h1 {
            text-align: center;
                color: rgb(241, 95, 241);
        }

        .club-card {
            text-align: center;
            border: 2px dotted rgb(230, 109, 230);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: rgb(248, 167, 248);
        }

        .club-card h3 {
            color: rgb(146, 0, 146);
        }
    </style>
</head>
<body>
    <h1>School club website</h1>

    <!--STEP 2 - container keeps the layout neat and centred-->
    <div class="container">
    
        <!--STEP 3 - row holds all the columns in one horizontal line -->
        <div class="row">
    
            <!--STEP 4 - col-12: full width on phones
                             col-md-6: half width on tablets
                             col-lg-4:one-third on desktops -->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="club-card">
                <h3>Music Club</h3>
                <p>We can play and learn music</p>
                </div>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <div class="club-card">
                        <h3>Game Club</h3>
                        <p>We can play games here</p>
                    </div>
                </div>

                <div class="col-12 col-md-6 col-lg-4">
                    <div class="club-card">
                        <h3>Dance Club</h3>
                        <p>We can practice Dance</p>
                    </div>
                </div>

                </div>
                </div>
                
                <!-- STEP 5 - Bootstrap JS script -->
                <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"> </script>
</body>
</html>
