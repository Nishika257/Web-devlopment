<!DOCTYPE html>
<html>
    <head>
        <title>my superhero card</title>
        <style>

            body {
                background-color: rgb(0, 0, 0);
                color:rgba(28, 134, 7, 0.925);
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            }

            .hero-name {
                font-size: 60px;
                font-weight: bold;
                color: rgb(71, 219, 25);
                text-shadow: -10px 4px rgb(37, 114, 4);
            }

            .tagline {
                font-size: italic;
                color: rgb(119, 172, 123);
                text-transform:capitalize;
            }

            .label {
                text-transform: uppercase;
                text-decoration: wavy;
                color: rgba(169, 243, 167, 0.226);
            }

            .power {
                font-weight: bold;
                color: rgb(96, 170, 114);
            }

            .weakness {
                text-decoration: line-through;
                color: darkseagreen;
            }

            .badge {
                font-size: 28px;
                font-weight: bold;
                color: rgba(253, 252, 252, 0.863);
                transform: rotate(15deg);
            }

            .made-by {
                color: chartreuse;
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <h1 class="hero-name">thunder kid</h1>
        <p class="tagline">the most powerful hero in the school</p>

        <h2 class="label">super powers</h2>
        <p class="power">can run faster than cheetah</p>
        <p class="power">can lift a school bus</p>

        <h2 class="label">weaknesses</h2>
        <p class="weakness">Maths homework</p>
        <p class="weakness">vegetables</p>
        <br><br><br><br>

        <p class="badge">Top Hero</p>

        <p class="made-by">Created by Nishika</p>
    </body>
</html>
