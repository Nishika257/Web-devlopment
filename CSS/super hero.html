<!DOCTYPE html>
<html>
    <head>
        <title>my superhero card</title>
        <style>

            body {
                background-color: rgb(0, 0, 0);
                color:rgba(28, 134, 7, 0.925);
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            }

            .hero-name {
                font-size: 60px;
                font-weight: bold;
                color: rgb(71, 219, 25);
                text-shadow: 8px 3px rgb(3, 10, 0);
            }

            .tagline {
                font-size: italic;
                color: rgb(119, 172, 123);
                text-transform:capitalize;
            }

            .lable {
                text-transform: uppercase;
                text-decoration: wavy;
                color: rgba(169, 243, 167, 0.226);
            }

            .power {
                font-weight: bold;
                color: rgb(96, 170, 114);
            }

            .weakness {
                text-decoration: line-through;
                color: darkseagreen;
            }

            .badge {
                font-size: 28px;
                font-weight: bold;
                color: rgba(253, 252, 252, 0.863);
                transform: rotate(15deg);
            }
        </style>
    </head>
</html>
