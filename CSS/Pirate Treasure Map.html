<!DOCTYPE html>
<html>
    <head>
        <title>Camtain blackbeard's treasure map</title>

        <style>
            body {
                background-color: #d9ae6b;
                font-family:'Lucida Sans Unicode'
            }

            .map {
                width: 500px;
                margin: 20px auto;
                background: #f4ddb0;
                border: 4px solid #5a3d1f;
                border-radius: 10px;
                padding: 30px;
                box-shadow: 8px 8 px 15px rgba(0,0,0,0.4 );
            }

            .map-title {
                text-align: center;
                font-size: 32px;
                font-weight: bold;
                letter-spacing: 3px;
                text-transform: uppercase;
            }

            .subtitle {
                text-align: center;
                font-style: italic;
                color: #6b4b2a;
                margin: 30px;
            }

            hr {
                border: 1px dashed #6b4b2a;
                margin-bottom: 30px;
            }

            ul {
                list-style: none;
                padding: 0;
            }

            li {
                font-size: 18px;
                margin: 25px 0;
            }

            .fake-location {
                text-decoration: line-through;
            }

            .real-location {
                font-weight: bold;
                color: #c8a000;
                text-decoration: underline;
            }
        </style>
    </head>

    <body>

        <div class="map">

        <div style="text-align:center ; font-size: 60px;">☠️</div>

        <h1 class="map-title">
            captain blackbeard's treasure map
        </h1>
        <p class="subtitle"> X marks the spot... if you can find it.</p>

        <hr>
        
        <ul>
        
            <li>❌ <span class="fake-location">Skull Island Cove</span></li>
        
            <li>❌ <span class="fake-location">The Kraken's Lagoon</span></li>
        
            <li>✅ <span class="real-location">Devil's Tooth Rock, East Shore</span></li>
        
        </ul>

        </div>
    </body>
</html>
