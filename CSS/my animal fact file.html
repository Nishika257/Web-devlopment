<!DOCTYPE html>
<html>
    <head>
        <title>My animal fact file</title>
        <style>
            body {
                background-color: rgb(6, 116, 2);
                font-family: 'Courier New', Courier, monospace;
            }

            .fact-file {
                background-color: rgb(11, 80, 37);
                color: rgb(149, 240, 141);
                width: 400px;
                padding: 25px;
                border: 4px solid rgb(14, 134, 14);
                margin: 30px;
            }

            .animal-name {
                color: rgb(0, 0, 0);
                font-size: 22px;
            }

            .detail {
                color: rgb(255, 255, 255);
            }

            .cool-fact {
                color: rgb(235, 189, 247);
                font-style: italic;
            }
        </style>
    </head>
    <body>
        <div class="fact-file">
            <h2 class="animal-name">Snow Leopard</h2>
            <p class="detail">Lives in: Mountain ranges of Central Asia</p>
            <p class="detail">Diet: Deer,goats,and wild sheep</p>
            <p class="detail">Type Big Cat</p>
            <p class="cool-fact">cool fact:Can leap up to 15 metres in one jump</p></div>


    </body>
</html>
